appId: com.elipse-dat-to-csv
productName: Elipse DAT Converter
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
extraMetadata:
  main: ./out/main/index.js
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  category: Utility
  maintainer: elipse-dat-to-csv
